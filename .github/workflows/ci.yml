name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t africa-dev-gateway:test .
      - name: Run the clean mock gateway smoke test
        env:
          PAYMENT_PROVIDERS: mock
          GATEWAY_ALLOW_MOCK: "true"
        run: |
          docker compose up -d --build --wait
          pnpm quickstart
      - name: Collect gateway logs after a smoke-test failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove smoke-test services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
